name: Build & Release

on:
  push:
    branches: [main]      # vérifie que l'exe se construit (artefact téléchargeable dans l'onglet Actions)
    tags: ["v*"]          # un tag vX.Y.Z publie l'exe dans les Releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python tools/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build exe
        shell: pwsh
        run: |
          $opts = @('--noconfirm', '--onefile', '--windowed', '--name', 'Kalkid-Retro',
                    '--icon', 'assets/kalkid.ico', '--collect-submodules', 'winsdk')
          # le logo et les portraits de classes sont embarqués dans l'exe
          if (Test-Path assets/logo.png) { $opts += @('--add-data', 'assets/logo.png;assets') }
          if (Test-Path assets/portraits) { $opts += @('--add-data', 'assets/portraits;assets/portraits') }
          pyinstaller @opts run.py

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkid-Retro
          path: dist/Kalkid-Retro.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path kalkid_retro/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\kalkid.iss
          if (-not (Test-Path dist/Kalkid-Retro-Setup.exe)) { throw "Installateur non généré" }

      - name: Checksums SHA-256
        shell: pwsh
        run: |
          foreach ($f in 'Kalkid-Retro.exe', 'Kalkid-Retro-Setup.exe') {
            $hash = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("dist/$f.sha256", $hash)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkid-Retro-Setup
          path: dist/Kalkid-Retro-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kalkid-Retro-Setup.exe
            dist/Kalkid-Retro-Setup.exe.sha256
            dist/Kalkid-Retro.exe
            dist/Kalkid-Retro.exe.sha256
          generate_release_notes: true
